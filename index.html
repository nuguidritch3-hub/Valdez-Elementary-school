<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valdez Elementary School Portal</title>
    <script>
      // Automatically clean local developer cache and service workers to keep graphics updated
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        // Unregister service workers which can trap old assets
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
              registration.unregister().then(() => {
                console.log('Stale service worker found and unregistered.');
                location.reload(true);
              });
            }
          });
        }
        // Clear Cache Storage
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) {
              caches.delete(name);
            }
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
